steps:
- name: 'gcr.io/cloud-builders/gcloud'
  args: [
    'functions', 'deploy', 'gcs_trigger',
    '--source=.',
    '--runtime=python310',
    '--entry-point=gcs_trigger',
    '--region=us-central1',
    '--trigger-http',  # No direct event trigger
    '--allow-unauthenticated'
  ]

# Set Cloud Build to use the latest logs
options:
  logging: CLOUD_LOGGING_ONLY